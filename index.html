<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Architectural Visual Engine | Zippy Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050507; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #fff; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-overlay { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 3rem; pointer-events: none; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: 700; tracking: 0.2em; text-transform: uppercase; background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tag { border: 1px solid rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); }
        .hero-title { max-width: 600px; }
        h1 { font-size: 3.5rem; font-weight: 300; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 1rem; }
        p { color: #888; font-size: 1rem; max-width: 400px; line-height: 1.6; }
        footer { display: flex; justify-content: space-between; align-items: flex-end; }
        .stat { font-size: 0.8rem; color: #666; }
        .stat span { display: block; font-size: 1.5rem; color: #fff; font-weight: 500; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <header>
            <div class="logo">ZIPPY // ENGINE</div>
            <div class="tag">WebGL 3D Core v2.0</div>
        </header>

        <div class="hero-title">
            <h1>Dynamic Shader Architecture</h1>
            <p>Real-time interactive particle physics & geometry displacement optimized for high-conversion web experiences.</p>
        </div>

        <footer>
            <div class="stat">
                FPS PERFORMANCE
                <span>60.0 PERFECT</span>
            </div>
            <div class="stat">
                INTERACTION
                <span>CURSOR SENSITIVE</span>
            </div>
        </footer>
    </div>

    <script>
        // Three.js Interactive 3D Sphere Core
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Geometry & Wireframe Shader Mesh
        const geometry = new THREE.IcosahedronGeometry(1.5, 32);
        const material = new THREE.MeshBasicMaterial({
            color: 0x4f46e5,
            wireframe: true,
            transparent: true,
            opacity: 0.35
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Outer Particle Ring
        const particleGeo = new THREE.BufferGeometry();
        const count = 1200;
        const positions = new Float32Array(count * 3);

        for(let i=0; i<count*3; i+=3) {
            positions[i] = (Math.random() - 0.5) * 8;
            positions[i+1] = (Math.random() - 0.5) * 8;
            positions[i+2] = (Math.random() - 0.5) * 8;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 0.015,
            color: 0xffffff,
            transparent: true,
            opacity: 0.6
        });

        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Mouse Interaction
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            mesh.rotation.x = elapsedTime * 0.15;
            mesh.rotation.y = elapsedTime * 0.2;

            particles.rotation.y = elapsedTime * -0.05;

            // Parallax Smooth Follow
            mesh.rotation.x += mouseY * 0.05;
            mesh.rotation.y += mouseX * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
