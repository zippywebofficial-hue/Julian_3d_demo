<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-CONCEPT // AUTOMOTIVE VISUALIZER</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 500vh; background: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .ui { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; padding: 4rem; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        h1 { font-size: 6rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.05em; margin: 0; }
        .sub { font-size: 1rem; color: #888; max-width: 400px; line-height: 1.5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <h1>X-CONCEPT</h1>
        <div class="sub">Next-gen automotive geometry. High-fidelity rendering with real-time curvature analysis. Designed for global luxury standards.</div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Abstract Automotive Shape (Kinetic Knot)
        const geometry = new THREE.TorusKnotGeometry(1.5, 0.4, 256, 32);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x111111, 
            metalness: 0.9, 
            roughness: 0.1,
            wireframe: false 
        });
        const carConcept = new THREE.Mesh(geometry, material);
        scene.add(carConcept);

        // Premium Lighting
        const light1 = new THREE.DirectionalLight(0xffffff, 1);
        light1.position.set(5, 5, 5);
        scene.add(light1);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        camera.position.z = 5;

        let scroll = 0;
        window.addEventListener('scroll', () => { scroll = window.scrollY / 1000; });

        function animate() {
            requestAnimationFrame(animate);
            // Smooth Camera Interpolation
            camera.position.z = 5 - scroll * 0.5;
            carConcept.rotation.y = scroll * 0.5;
            carConcept.rotation.x = scroll * 0.2;
            
            // Subtle Automotive Float
            carConcept.position.y = Math.sin(Date.now() * 0.001) * 0.2;
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
