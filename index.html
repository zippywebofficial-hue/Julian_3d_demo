<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER // Next-Gen Digital Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
        }
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 5vw;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 100%);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .hero {
            pointer-events: auto;
            max-width: 800px;
        }
        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -2px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.1rem;
            color: #888;
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
        }
        .btn-primary {
            padding: 1rem 2.5rem;
            border-radius: 40px;
            border: none;
            background: #fff;
            color: #000;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-primary:hover {
            transform: scale(1.05);
        }
        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.8rem;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="overlay">
        <header>
            <div class="brand">AETHER</div>
            <div class="badge">STUDIO 2026</div>
        </header>

        <div class="hero">
            <h1>CRAFTING DIGITAL REALITIES</h1>
            <p>Pioneering 3D interactive web experiences, real-time shaders, and immersive visual storytelling for high-tier global brands.</p>
            <div class="btn-group">
                <button class="btn-primary">EXPLORE WORK</button>
            </div>
        </div>

        <footer>
            <div>INTERACTIVE SHADER CORE</div>
            <div>[ DRAG & MOVE TO DISTORT ]</div>
        </footer>
    </div>

    <script>
        // --- 1. SETUP ---
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- 2. ADVANCED PARTICLE SPHERE (3D SHADER CORE) ---
        const count = 12000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const originalPositions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        const color1 = new THREE.Color('#00f2fe');
        const color2 = new THREE.Color('#4facfe');
        const color3 = new THREE.Color('#ff007f');

        for (let i = 0; i < count; i++) {
            // Sphere Math Distribution
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 1.8 + (Math.random() - 0.5) * 0.3;

            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            originalPositions[i * 3] = x;
            originalPositions[i * 3 + 1] = y;
            originalPositions[i * 3 + 2] = z;

            // Gradient Color Mapping
            const mixedColor = color1.clone().lerp(color2, Math.random()).lerp(color3, (y + 2) / 4);
            colors[i * 3] = mixedColor.r;
            colors[i * 3 + 1] = mixedColor.g;
            colors[i * 3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.018,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particleSphere = new THREE.Points(geometry, material);
        scene.add(particleSphere);

        // --- 3. MOUSE & TOUCH INTERACTION ---
        let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function onPointerMove(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (x && y) {
                mouse.targetX = (x / window.innerWidth - 0.5) * 2;
                mouse.targetY = -(y / window.innerHeight - 0.5) * 2;
            }
        }

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove);

        // --- 4. ANIMATION & WAVE DISTORTION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Smooth Interpolation for Mouse
            mouse.x += (mouse.targetX - mouse.x) * 0.05;
            mouse.y += (mouse.targetY - mouse.y) * 0.05;

            // Rotation Logic
            particleSphere.rotation.y = time * 0.15 + mouse.x * 0.5;
            particleSphere.rotation.x = time * 0.1 + mouse.y * 0.5;

            // Dynamic Wave Particle Wave Deformation
            const posAttr = geometry.attributes.position;
            for (let i = 0; i < count; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                const ox = originalPositions[ix];
                const oy = originalPositions[iy];
                const oz = originalPositions[oz];

                const wave = Math.sin(time * 2 + ox * 3 + oy * 3) * 0.08;
                posAttr.array[ix] = ox + ox * wave;
                posAttr.array[iy] = oy + oy * wave;
                posAttr.array[iz] = oz + oz * wave;
            }
            posAttr.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // --- 5. RESPONSIVE RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
