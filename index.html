<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEAREBRAND Hollywood VFX 3D | Zippy Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 600vh; background: #010103; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: #ffffff; overflow-x: hidden; }
        
        #webgl-container, #css3d-container { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; }
        #webgl-container { z-index: 1; pointer-events: none; }
        #css3d-container { z-index: 2; pointer-events: none; }
        
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 3; pointer-events: none; background: radial-gradient(circle at center, transparent 10%, rgba(1,1,3,0.9) 100%), linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 100% 100%, 40px 40px, 40px 40px; }
        
        /* 3D Text Card Styling */
        .vfx-3d-node { width: 380px; padding: 2rem; background: rgba(5, 5, 12, 0.65); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(25px); border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 40px rgba(99, 102, 241, 0.2); pointer-events: auto; transform-style: preserve-3d; }
        
        .badge { display: inline-block; border: 1px solid rgba(245, 158, 11, 0.5); padding: 5px 14px; border-radius: 30px; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; background: rgba(245, 158, 11, 0.1); color: #f59e0b; margin-bottom: 1rem; }
        h1 { font-size: 2.2rem; font-weight: 200; line-height: 1.1; letter-spacing: -0.03em; text-transform: uppercase; background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.4) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.8rem; }
        p { color: rgba(255,255,255,0.7); font-size: 0.85rem; line-height: 1.6; font-weight: 300; }

        .hud-overlay { position: fixed; top: 2rem; left: 2.5rem; right: 2.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 20; pointer-events: none; }
        .hud-brand { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase; color: rgba(255,255,255,0.9); }

        .scroll-hint { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 20; font-size: 0.65rem; letter-spacing: 0.3em; color: rgba(255,255,255,0.4); text-transform: uppercase; pointer-events: none; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }
    </style>
    <!-- Three.js + CSS3DRenderer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
</head>
<body>

    <div id="webgl-container"></div>
    <div id="css3d-container"></div>
    <div class="grid-overlay"></div>

    <div class="hud-overlay">
        <div class="hud-brand">ZIPPY 3D VFX ENGINE // WEAREBRAND</div>
        <div class="badge" style="border-color:rgba(255,255,255,0.2); color:#fff; background:rgba(255,255,255,0.05);">HOLLYWOOD MESH 60 FPS</div>
    </div>

    <div class="scroll-hint">SCROLL / SWIPE TO ORBIT THE 3D PLANET</div>

    <script>
        // --- Dual Renderer Engine (WebGL + CSS3D) ---
        const webglContainer = document.getElementById('webgl-container');
        const css3dContainer = document.getElementById('css3d-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

        // WebGL Renderer (Background Planet & VFX Particles)
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        webglContainer.appendChild(renderer.domElement);

        // CSS3D Renderer (3D Rotating Text Cards)
        const cssRenderer = new THREE.CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        css3dContainer.appendChild(cssRenderer.domElement);

        // --- 1. HOLLYWOOD 3D EARTH GLOBE CORE ---
        const earthGroup = new THREE.Group();

        // Earth Wireframe Surface
        const earthGeo = new THREE.SphereGeometry(2.2, 36, 36);
        const earthMat = new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.25 });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        earthGroup.add(earthMesh);

        // Earth Particle Atmosphere Aura
        const atmosphereCount = 3500;
        const atmoGeo = new THREE.BufferGeometry();
        const atmoPos = new Float32Array(atmosphereCount * 3);
        const atmoColors = new Float32Array(atmosphereCount * 3);
        const c1 = new THREE.Color(0x6366f1);
        const c2 = new THREE.Color(0xf59e0b);

        for (let i = 0; i < atmosphereCount; i++) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 2.3 + (Math.random() - 0.5) * 0.4;
            atmoPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            atmoPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            atmoPos[i*3+2] = r * Math.cos(phi);

            const mixColor = c1.clone().lerp(c2, Math.random());
            atmoColors[i*3] = mixColor.r; atmoColors[i*3+1] = mixColor.g; atmoColors[i*3+2] = mixColor.b;
        }
        atmoGeo.setAttribute('position', new THREE.BufferAttribute(atmoPos, 3));
        atmoGeo.setAttribute('color', new THREE.BufferAttribute(atmoColors, 3));
        const atmoMat = new THREE.PointsMaterial({ size: 0.018, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const atmosphere = new THREE.Points(atmoGeo, atmoMat);
        earthGroup.add(atmosphere);

        // Orbital Ring
        const ringGeo = new THREE.TorusGeometry(3.5, 0.005, 16, 120);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.4, wireframe: true });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 3;
        earthGroup.add(ring);

        scene.add(earthGroup);

        // --- 2. 3D TEXT NODES (Ghumte Huye Slide Hone Wale Sections) ---
        const sectionsData = [
            { badge: "// 01 ORBITAL CORE", title: "Creative<br>Digital Expert", desc: "High-end WebGL visual architecture, real-time particle physics, dynamic shaders, and spatial computing." },
            { badge: "// 02 DYNAMIC WAVEFORM", title: "Architectural<br>Particle Mesh", desc: "Independent multi-layer object motion driven by custom trigonometric vector math in 3D orbit." },
            { badge: "// 03 SPATIAL INTELLIGENCE", title: "Interactive<br>HUD Matrix", desc: "Real-time camera trajectory tracking with responsive cursor vector physics." },
            { badge: "// 04 GLOBAL SHOWCASE", title: "Luxury Web<br>Experiences", desc: "Engineered for global luxury brands and production studios seeking Hollywood Awwwards quality." },
            { badge: "// 05 AUTONOMOUS DEPLOYMENT", title: "Ready For<br>Production", desc: "Target point reached. Seamless 60 FPS mobile rendering across all devices." }
        ];

        const textNodesGroup = new THREE.Group();
        const nodesList = [];

        sectionsData.forEach((data, index) => {
            const div = document.createElement('div');
            div.className = 'vfx-3d-node';
            div.innerHTML = `
                <div class="badge">${data.badge}</div>
                <h1>${data.title}</h1>
                <p>${data.desc}</p>
            `;

            const cssObject = new THREE.CSS3DObject(div);
            cssObject.scale.set(0.0045, 0.0045, 0.0045);

            // Orbit math positions around Earth Planet
            const angle = (index / sectionsData.length) * Math.PI * 2;
            const radius = 4.2;
            cssObject.position.x = Math.cos(angle) * radius;
            cssObject.position.z = Math.sin(angle) * radius;
            cssObject.position.y = (index - 2) * 1.5;

            cssObject.rotation.y = -angle + Math.PI / 2;

            textNodesGroup.add(cssObject);
            nodesList.push(cssObject);
        });

        scene.add(textNodesGroup);

        // --- Scroll Driven Camera Flight & Orbital Math ---
        let scrollProgress = 0;
        window.addEventListener('scroll', () => {
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            scrollProgress = window.scrollY / maxScroll;
        });

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Earth Planet Rotation & Floating
            earthMesh.rotation.y = time * 0.1;
            atmosphere.rotation.y = time * 0.15;
            ring.rotation.z = time * 0.05;

            // 3D Text Nodes Orbiting Planet (Gol Gol Ghumne Wala VFX Effect)
            textNodesGroup.rotation.y = scrollProgress * Math.PI * 2.2 + time * 0.05;

            // Camera Cinematic Flight Trajectory (Zoom in/out + Slide)
            const camRadius = 8 - Math.sin(scrollProgress * Math.PI) * 2.5;
            camera.position.x = Math.sin(scrollProgress * Math.PI * 2) * 2 + mouseX * 0.4;
            camera.position.y = (0.5 - scrollProgress) * 6 - mouseY * 0.4;
            camera.position.z = camRadius;

            camera.lookAt(0, (0.5 - scrollProgress) * 3, 0);

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
