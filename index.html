<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-CONCEPT | AUTOMOTIVE SHOWCASE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 600vh; background: #0a0a0a; font-family: 'Helvetica Neue', sans-serif; color: white; overflow-x: hidden; }
        #canvas { position: fixed; top: 0; left: 0; z-index: 1; }
        
        /* Sections */
        .section { height: 100vh; display: flex; align-items: center; padding: 0 10vw; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
        .section.active { opacity: 1; }
        .content { background: rgba(0,0,0,0.6); padding: 3rem; border-left: 2px solid #ffd700; backdrop-filter: blur(10px); }
        h1 { font-size: 5rem; text-transform: uppercase; line-height: 0.9; }
        p { margin-top: 1rem; font-size: 1.2rem; color: #ccc; max-width: 400px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="section" id="s1" style="opacity: 1;">
        <div class="content"><h1>X-CONCEPT<br>EVO</h1><p>Engineered for the next generation of performance luxury.</p></div>
    </div>
    <div class="section" id="s2">
        <div class="content"><h1>PRECISION<br>AERODYNAMICS</h1><p>Carbon fiber bodywork sculpted to defy drag and capture light.</p></div>
    </div>
    <div class="section" id="s3">
        <div class="content"><h1>PURE<br>ELECTRIC</h1><p>Zero emissions, limitless velocity. The future of motion.</p></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // -- Car Geometry (Abstract) --
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.6, 4), new THREE.MeshStandardMaterial({color: 0x333333, metalness: 0.8, roughness: 0.2}));
        group.add(body);
        
        // Wheels
        [[-0.8, -0.3, 1], [0.8, -0.3, 1], [-0.8, -0.3, -1], [0.8, -0.3, -1]].forEach(pos => {
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16), new THREE.MeshBasicMaterial({color: 0x111111}));
            wheel.rotation.z = Math.PI/2;
            wheel.position.set(...pos);
            group.add(wheel);
        });
        scene.add(group);

        // Lighting
        scene.add(new THREE.DirectionalLight(0xffffff, 2));
        scene.add(new THREE.AmbientLight(0x444444));

        let scroll = 0;
        window.addEventListener('scroll', () => {
            scroll = window.scrollY / (document.body.scrollHeight - window.innerHeight);
            // Toggle Section Visibility
            document.querySelectorAll('.section').forEach((s, i) => {
                s.classList.toggle('active', scroll > i * 0.2 && scroll < (i + 1) * 0.2);
            });
        });

        function animate() {
            requestAnimationFrame(animate);
            // Camera Rail Logic
            camera.position.z = 10 - scroll * 15; 
            camera.position.y = 2 + Math.sin(scroll * 10) * 0.5;
            camera.lookAt(0, 0, 0);
            
            group.rotation.y = scroll * 2;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
