<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEAREBRAND Level 3D Experience | Zippy Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020204; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: #ffffff; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 3rem 5rem; pointer-events: none; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase; color: rgba(255,255,255,0.9); }
        .badge { border: 1px solid rgba(255,255,255,0.18); padding: 8px 20px; border-radius: 40px; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); }
        .hero { max-width: 650px; margin-top: auto; margin-bottom: auto; }
        .hero h1 { font-size: 5rem; font-weight: 200; line-height: 1.0; letter-spacing: -0.04em; margin-bottom: 1.5rem; text-transform: uppercase; background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.4) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: rgba(255,255,255,0.6); font-size: 1.05rem; max-width: 440px; line-height: 1.7; font-weight: 300; }
        footer { display: flex; justify-content: space-between; align-items: flex-end; }
        .stat-block { display: flex; gap: 4rem; }
        .metric { font-size: 0.65rem; letter-spacing: 0.25em; color: rgba(255,255,255,0.4); text-transform: uppercase; }
        .metric span { display: block; font-size: 1.6rem; color: #fff; font-weight: 400; margin-top: 6px; font-family: monospace; }
        @media (max-width: 768px) {
            .ui-layer { padding: 2rem; }
            .hero h1 { font-size: 3rem; }
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header>
            <div class="brand">ZIPPY ARCHITECTURE</div>
            <div class="badge">GPU GLSL Core v5.0</div>
        </header>

        <div class="hero">
            <h1>Kinetic Visual Engine</h1>
            <p>Real-time WebGL particle physics, noise deformation shaders, and cinematic ray-marching lighting built for high-tier brands.</p>
        </div>

        <footer>
            <div class="stat-block">
                <div class="metric">RENDER PERFORMANCE<span>60.0 FPS</span></div>
                <div class="metric">SHADER DISPLACEMENT<span>GLSL ACTIVE</span></div>
            </div>
            <div class="metric">INTERACTION MODE<span>DYNAMIC CURSOR VECTOR</span></div>
        </footer>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Custom Shader Material for Liquid Vertex Wave ---
        const vertexShader = `
            uniform float uTime;
            uniform vec2 uMouse;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vDisplacement;

            // Simplex Noise Math
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            void main() {
                vNormal = normal;
                vPosition = position;
                
                // Displace vertices with Simplex Noise + Cursor Vector
                float noise = snoise(position * 1.5 + vec3(uTime * 0.4));
                vDisplacement = noise;
                
                vec3 newPosition = position + normal * (noise * 0.35 + uMouse.x * 0.15);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vDisplacement;

            void main() {
                // Glow Shader Color Mix (Cyber Violet + Gold Neon)
                vec3 color1 = vec3(0.08, 0.03, 0.22); // Deep Indigo
                vec3 color2 = vec3(0.9, 0.65, 0.2);   // Golden Amber Glow
                vec3 color3 = vec3(0.2, 0.5, 0.95);  // Electric Blue Light

                float mixFactor = vDisplacement * 0.5 + 0.5;
                vec3 finalColor = mix(color1, color2, mixFactor);
                finalColor += color3 * pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.0) * 0.8;

                gl_FragColor = vec4(finalColor, 0.85);
            }
        `;

        // Shader Mesh Object
        const geometry = new THREE.IcosahedronGeometry(1.7, 64);
        const uniforms = {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) }
        };

        const shaderMaterial = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: uniforms,
            wireframe: true,
            transparent: true
        });

        const sphere = new THREE.Mesh(geometry, shaderMaterial);
        scene.add(sphere);

        // --- Outer Ring Core (Like Julian Video) ---
        const ringGeo = new THREE.TorusGeometry(2.4, 0.01, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true, transparent: true, opacity: 0.4 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        scene.add(ring);

        // --- 4000 Particle Dust Cloud ---
        const pCount = 3500;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);

        for (let i = 0; i < pCount * 3; i += 3) {
            pPos[i] = (Math.random() - 0.5) * 14;
            pPos[i+1] = (Math.random() - 0.5) * 14;
            pPos[i+2] = (Math.random() - 0.5) * 14;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({
            size: 0.015,
            color: 0xffffff,
            transparent: true,
            opacity: 0.65
        });

        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // --- Cursor Tracking ---
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        // --- Render Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            uniforms.uTime.value = elapsedTime;
            uniforms.uMouse.value.set(mouseX, mouseY);

            sphere.rotation.y = elapsedTime * 0.12;
            sphere.rotation.x = elapsedTime * 0.08;

            ring.rotation.x = elapsedTime * 0.2 + mouseY * 0.5;
            ring.rotation.y = elapsedTime * 0.15 + mouseX * 0.5;

            particles.rotation.y = elapsedTime * -0.03;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
